# This file ONLY holds tool configuration (ruff, pytest) for all Python code.
# Dependencies live in each component's requirements.txt (etl/, ml/, backend/).

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "ml/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["etl/tests", "ml/tests", "backend/tests"]
pythonpath = [".", "backend"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff.lint.isort]
known-first-party = ["app", "etl", "ml"]

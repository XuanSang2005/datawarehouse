# Usage:
#   docker compose up -d db                 # Daily dev: run PostgreSQL only
#   docker compose --profile app up -d --build   # Demo: db + etl (runs the pipeline once) + backend + frontend
#   docker compose logs -f etl              # Follow the pipeline; wait for the line "Pipeline finished"
#   docker compose run --rm etl             # Rerun the pipeline in Docker (no venv needed)
#   docker compose down                     # Stop (keep data)
#   docker compose down -v                  # Stop + DELETE DB data (clean reset)
name: tourism-dss

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  etl:
    # Runs python -m etl.run_pipeline once and exits (exit 0 = success).
    # Downloaded source files are kept in the `rawdata` volume, so later runs do not download again.
    profiles: ["app"]
    build:
      context: .
      dockerfile: etl/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - rawdata:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db          # inside the Docker network, the DB hostname is "db"
      POSTGRES_PORT: 5432
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  rawdata:

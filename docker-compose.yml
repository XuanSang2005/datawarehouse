# Cách dùng:
#   docker compose up -d db                 # Dev hằng ngày: chỉ chạy PostgreSQL
#   docker compose --profile app up -d --build   # Demo: db + etl (chạy pipeline 1 lần) + backend + frontend
#   docker compose logs -f etl              # Theo dõi pipeline, đợi dòng "Pipeline hoàn tất"
#   docker compose run --rm etl             # Chạy lại pipeline trong Docker (không cần venv)
#   docker compose down                     # Dừng (giữ dữ liệu)
#   docker compose down -v                  # Dừng + XÓA dữ liệu DB (reset sạch)
name: tourism-dss

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  etl:
    # Chạy python -m etl.run_pipeline một lần rồi thoát (exit 0 = thành công).
    # File nguồn tải về được giữ trong volume `rawdata`, lần sau không tải lại.
    profiles: ["app"]
    build:
      context: .
      dockerfile: etl/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - rawdata:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db          # trong mạng Docker, DB có hostname là "db"
      POSTGRES_PORT: 5432
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  rawdata:

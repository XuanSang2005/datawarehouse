# nginx template (the nginx image fills ${PORT}, ${BACKEND_URL} from environment variables at startup).
# docker compose: PORT=80, BACKEND_URL=http://backend:8000 (defaults in the Dockerfile).
# Railway: PORT is assigned by Railway, BACKEND_URL = https://<public domain of the backend service>.
server {
  listen ${PORT};
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_ssl_server_name on;
  }

  location / {
    try_files $uri /index.html;
  }
}

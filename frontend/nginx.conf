# Template nginx (image nginx thay ${PORT}, ${BACKEND_URL} từ biến môi trường khi khởi động).
# docker compose: PORT=80, BACKEND_URL=http://backend:8000 (mặc định trong Dockerfile).
# Railway: PORT do Railway cấp, BACKEND_URL = https://<domain công khai của service backend>.
server {
  listen ${PORT};
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_ssl_server_name on;
  }

  location / {
    try_files $uri /index.html;
  }
}
